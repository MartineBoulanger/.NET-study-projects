<h3>Registratie formulier</h3>
<form [formGroup]="registrationModel" (ngSubmit)="registerOnSubmit()">
  <div class="form-group row">
    <label for="firstName" class="col-sm-2 col-form-label"> Voornaam </label>
    <div class="col-sm-5">
      <input type="text" class="form-control" id="firstName" formControlName="firstName" />
    </div>
  </div>
  <div class="form-group row">
    <label for="lastName" class="col-sm-2 col-form-label"> Familienaam </label>
    <div class="col-sm-5">
      <input type="text" class="form-control" id="lastName" formControlName="lastName" />
    </div>
  </div>
  <div formGroupName="address">
    <div class="form-group row">
      <label for="street" class="col-sm-2 col-form-label"> Straat </label>
      <div class="col-sm-5">
        <input type="text" class="form-control" id="street" formControlName="street" />
      </div>
    </div>
    <div class="form-group row">
      <label for="zipcode" class="col-sm-2 col-form-label"> Postcode </label>
      <div class="col-sm-5">
        <input type="text" class="form-control" id="zipcode" formControlName="zipcode" />
      </div>
    </div>
    <div class="form-group row">
      <label for="city" class="col-sm-2 col-form-label"> Gemeente </label>
      <div class="col-sm-5">
        <input type="text" class="form-control" id="city" formControlName="city" />
      </div>
    </div>
  </div>
  <div formArrayName="phoneNumbers">
    @for (t of phoneNumbers.controls; track t; let i = $index) {
      <div class="form-group row">
        <label for="{{ i }}" class="col-sm-2 col-form-label"> Telefoonnummer {{ i + 1 }} </label>
        <div class="col-sm-3">
          <input type="text" class="form-control" id="{{ i }}" [formControlName]="i" />
        </div>
        <div class="col-sm-2">
          <button class="btn btn-danger" (click)="removePhoneNumberAt(i)">X</button>
        </div>
      </div>
    }
  </div>
  <div class="form-group row">
    <div class="col-sm-2"></div>
    <div class="col-sm-5">
      <button class="btn btn-primary" (click)="addPhoneNumber()">Nieuw telefoonnummer</button>
    </div>
  </div>
  <button type="submit" class="btn btn-primary">Registreer</button>
</form>

<p>
  {{ registrationModel.value | json }}
</p>
